[project]
name = "dork-cli"
version = "0.1.0"
description = "Dork-based recon orchestrator for authorized bug bounty programs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0.1",
    "beautifulsoup4>=4.12.0",
    "python-dotenv>=1.0.1",
]

[project.scripts]
dork = "dork_cli.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dork_cli"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]
